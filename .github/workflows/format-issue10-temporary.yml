name: One-shot issue 10 gofmt
on:
  push:
    branches: [feat/issue-10-firewalld-denied-sensor]
permissions:
  contents: read
jobs:
  format:
    if: github.actor == 'maestroi' && github.ref == 'refs/heads/feat/issue-10-firewalld-denied-sensor'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format only issue 10 changed Go files
        run: |
          set -euo pipefail
          gofmt -w internal/sensor/firewalld/*.go internal/agent/config.go internal/agent/runner.go internal/agent/runner_test.go internal/agent/transport.go
          git diff --check
          git add -- internal/sensor/firewalld/*.go internal/agent/config.go internal/agent/runner.go internal/agent/runner_test.go internal/agent/transport.go
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: gofmt optional firewalld sensor and agent integration"
          git push origin HEAD:refs/heads/feat/issue-10-firewalld-denied-sensor
