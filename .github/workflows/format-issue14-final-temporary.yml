name: One-shot issue 14 final gofmt
on:
  push:
    branches: [feat/issue-14-operator-audit-health]
permissions:
  contents: read
jobs:
  format:
    if: github.actor == 'maestroi' && github.ref == 'refs/heads/feat/issue-14-operator-audit-health'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format final retention regression
        run: |
          set -euo pipefail
          gofmt -w internal/controller/store/operator_test.go
          git diff --check
          git add -- internal/controller/store/operator_test.go
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: gofmt operator purge regressions"
          git push origin HEAD:refs/heads/feat/issue-14-operator-audit-health
