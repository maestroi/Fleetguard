# Example scrape config for the homelab. Addresses are placeholders: replace
# with each host's private/Tailscale IP. The /metrics endpoints are plain HTTP
# and read-only; reach them over the tailnet or a private TLS reverse proxy,
# never a public interface.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: fleetguard-controller
    static_configs:
      - targets: ["100.64.0.10:9465"]
        labels: {role: controller}

  - job_name: fleetguard-agent
    static_configs:
      - targets: ["100.64.0.21:9464", "100.64.0.22:9464"]
        labels: {role: agent, service_group: lab-ssh}
