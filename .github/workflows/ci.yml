name: Go CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true # D-Bus client module checksummed in go.sum
      - name: Install SQLite C headers (controller only)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Format check
        run: make fmt-check
      - name: Check module metadata
        run: make tidy-check
      - name: Static analysis
        run: make vet
      - name: Protocol contract and fixture tests
        run: go test -count=1 ./pkg/protocol
      - name: Rootless simulated sensor, firewall and partition tests
        run: go test -count=1 ./internal/firewall/mock ./internal/firewall/firewalld ./internal/sensor/synthetic ./internal/sensor/firewalld ./internal/lab
      - name: Rootless D-Bus reconcile benchmark (1/100/10000; 10000 rejects)
        run: go test -run '^$' -bench '^BenchmarkReconcile$' -benchtime=20x -benchmem ./internal/firewall/firewalld
      - name: Compile gated disposable-VM D-Bus integration test (never execute it in CI)
        run: go test -tags=firewalld_integration -run '^$' ./internal/firewall/firewalld
      - name: Firewalld set plan is read-only and reproducible
        run: |
          output="$(python3 scripts/plan-firewalld-set.py --zone public --node lab-a --group rpc --service web --protocol tcp --port 8899)"
          grep -q '^name: fg1_1249d4bd57f69425$' <<<"$output"
          grep -q '<option name="family" value="inet"/>' <<<"$output"
          test "$(grep -c '<ipset type=' <<<"$output")" -eq 1
      - name: Firewalld bounded-cardinality benchmark (10000 sources)
        run: go test -run '^$' -bench '^BenchmarkCardinalityCapped$' -benchtime=2x -benchmem ./internal/sensor/firewalld
      - name: Agent signed-policy recovery, bounded polling and rootless offline tests
        run: go test -count=1 ./internal/agent/...
      - name: Controller auth / SQLite / HTTPS regression tests
        run: go test -count=1 ./internal/controller/... ./pkg/protocol
      - name: Release and auto-merge policy tests
        run: |
          bash scripts/test-release-version.sh
          bash scripts/test-eligible-owner-pr.sh
      - name: Cross-node correlation and operator audit tests
        run: go test -count=1 ./internal/controller/correlation ./internal/controller/store ./cmd/fleetguard-controller
      - name: Unit tests (race detector)
        run: go test -race ./...
      - name: Build Linux amd64 binaries
        run: make build
      - name: Unprivileged simulated smoke test
        run: make smoke
      - name: Validate Compose least-privilege contract
        run: |
          docker compose --env-file deploy/controller/.env.example \
            -f deploy/controller/compose.yaml config --format json > "$RUNNER_TEMP/fleetguard-compose.json"
          python3 scripts/test-compose-security.py "$RUNNER_TEMP/fleetguard-compose.json"
      - name: Build and smoke-test unprivileged controller image
        run: |
          docker build -f Dockerfile.controller --build-arg VERSION=ci -t fleetguard-controller:ci .
          test "$(docker image inspect --format '{{.Config.User}}' fleetguard-controller:ci)" = "65532:65532"
          output="$(docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 --pids-limit 64 \
            fleetguard-controller:ci -version)"
          case "$output" in *ci*) ;; *) echo "Bad image version: $output" >&2; exit 1;; esac
