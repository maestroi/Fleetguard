name: Go CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no external Go dependencies yet, and no go.sum
      - name: Install SQLite C headers (controller only)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Format check
        run: make fmt-check
      - name: Check module metadata
        run: make tidy-check
      - name: Static analysis
        run: make vet
      - name: Protocol contract and fixture tests
        run: go test -count=1 ./pkg/protocol
      - name: Rootless simulated sensor, firewall and partition tests
        run: go test -count=1 ./internal/firewall/mock ./internal/sensor/synthetic ./internal/lab
      - name: Controller auth / SQLite / HTTPS regression tests
        run: go test -count=1 ./internal/controller/... ./pkg/protocol
      - name: Release and auto-merge policy tests
        run: |
          bash scripts/test-release-version.sh
          bash scripts/test-eligible-owner-pr.sh
      - name: Cross-node correlation and operator audit tests
        run: go test -count=1 ./internal/controller/correlation ./internal/controller/store ./cmd/fleetguard-controller
      - name: Unit tests (race detector)
        run: go test -race ./...
      - name: Build Linux amd64 binaries
        run: make build
      - name: Unprivileged simulated smoke test
        run: make smoke
