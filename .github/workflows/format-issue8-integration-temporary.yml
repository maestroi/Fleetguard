# Temporary one-shot format helper, removed before review.
name: One-shot format issue 8 VM test
on:
  push:
    branches: [feat/issue-8-firewalld-dbus-backend]
permissions:
  contents: read
jobs:
  format:
    if: github.actor == 'maestroi'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format one Go integration test and push
        run: |
          set -euo pipefail
          gofmt -w internal/firewall/firewalld/vm_integration_test.go
          git diff --check
          git add -- internal/firewall/firewalld/vm_integration_test.go
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: gofmt firewalld VM integration test"
          git push origin HEAD:refs/heads/feat/issue-8-firewalld-dbus-backend
