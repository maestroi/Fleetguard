# Temporary branch-local formatter for issue #8. Removed after formatting.
name: One-shot issue 8 gofmt
on:
  push:
    branches: [feat/issue-8-firewalld-dbus-backend]
permissions:
  contents: read
jobs:
  format:
    if: github.actor == 'maestroi' && github.ref == 'refs/heads/feat/issue-8-firewalld-dbus-backend'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format firewalld files and commit only formatting
        run: |
          set -euo pipefail
          gofmt -w internal/firewall/firewalld/backend.go internal/firewall/firewalld/backend_test.go internal/firewall/firewalld/dbus.go
          git diff --check
          git add -- internal/firewall/firewalld/backend.go internal/firewall/firewalld/backend_test.go internal/firewall/firewalld/dbus.go
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: gofmt issue 8 D-Bus adapter"
          git push origin HEAD:refs/heads/feat/issue-8-firewalld-dbus-backend
