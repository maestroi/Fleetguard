# Every push/merge to main publishes versioned binary + controller-container assets.
# Auto-merges performed with GITHUB_TOKEN use workflow_dispatch instead.
name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged main commit SHA (optional, for bot merges)
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: fleetguard-release-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out full main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate main commit and select version
        id: version
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid release SHA.' >&2
            exit 1
          fi
          # The release can only target a commit on main's first-parent line.
          # This rejects arbitrary PR/fork commits and keeps numbering monotonic.
          git fetch origin main --no-tags
          if ! git rev-list --first-parent origin/main | grep -Fx "$REQUESTED_SHA" >/dev/null; then
            echo 'Commit is not on the first-parent history of main.' >&2
            exit 1
          fi
          git checkout --detach "$REQUESTED_SHA"
          tag="$(bash scripts/release-version.sh "$REQUESTED_SHA")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Building release $tag for $REQUESTED_SHA"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install SQLite headers for controller
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Verify release source
        run: |
          make check
          go test -race ./...
          bash scripts/test-release-version.sh
          docker compose --env-file deploy/controller/.env.example \
            -f deploy/controller/compose.yaml config --format json > "$RUNNER_TEMP/fleetguard-compose.json"
          python3 scripts/test-compose-security.py "$RUNNER_TEMP/fleetguard-compose.json"

      - name: Build, smoke-test, and package Linux AMD64 + Compose
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          make build VERSION="$RELEASE_TAG" COMMIT="${RELEASE_SHA:0:12}" BUILD_DATE=unknown
          make smoke
          mkdir -p release/stage
          cp dist/fleetguard-agent dist/fleetguard-controller dist/fleetguardctl release/stage/
          cp README.md LICENSE release/stage/
          printf '%s\n' "$RELEASE_TAG" > release/stage/VERSION
          archive="fleetguard_${RELEASE_TAG}_linux_amd64.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git show -s --format=%ct "$RELEASE_SHA")" \
            -czf "release/$archive" -C release/stage .
          compose_archive="fleetguard_${RELEASE_TAG}_compose.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git show -s --format=%ct "$RELEASE_SHA")" \
            -czf "release/$compose_archive" -C deploy/controller \
            compose.yaml .env.example server.example.json registry.example.json README.md
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          echo "Assets: release/$archive release/$compose_archive"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fleetguard-${{ steps.version.outputs.tag }}-linux-amd64-and-compose
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Build and smoke-test controller container without privileges
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/maestroi/fleetguard-controller:${RELEASE_TAG}"
          docker build -f Dockerfile.controller \
            --build-arg VERSION="$RELEASE_TAG" \
            --build-arg COMMIT="${RELEASE_SHA:0:12}" \
            -t "$image" .
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "65532:65532"
          output="$(docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 --pids-limit 64 \
            "$image" -version)"
          case "$output" in *"$RELEASE_TAG"*) ;; *) echo "Wrong image version: $output" >&2; exit 1;; esac
          echo "Unprivileged image smoke test: $output"

      - name: Publish version-pinned controller image to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/maestroi/fleetguard-controller"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$RELEASE_TAG"
          docker tag "$image:$RELEASE_TAG" "$image:sha-$RELEASE_SHA"
          docker push "$image:sha-$RELEASE_SHA"
          docker logout ghcr.io

      - name: Create or repair GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          archive="release/fleetguard_${RELEASE_TAG}_linux_amd64.tar.gz"
          compose="release/fleetguard_${RELEASE_TAG}_compose.tar.gz"
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            # Never replace the assets of a tag pointing to another commit.
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            actual="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            [[ "$actual" == "$RELEASE_SHA" ]] || {
              echo "Tag $RELEASE_TAG points to unexpected commit $actual" >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" "$archive" "$compose" release/SHA256SUMS \
              --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" "$compose" release/SHA256SUMS \
              --repo "$GH_REPO" --target "$RELEASE_SHA" \
              --title "$RELEASE_TAG" --prerelease \
              --notes "Experimental Fleetguard build from main at $RELEASE_SHA. Observe-only by default; not production ready. Linux AMD64 binaries and least-privilege Compose example attached. Controller image: ghcr.io/maestroi/fleetguard-controller:$RELEASE_TAG (linux/amd64; needs private configuration and persistent SQLite volume). The controller image contains no firewall enforcement or host networking access. See docs/container-deployment.md and SHA256SUMS."
          fi
