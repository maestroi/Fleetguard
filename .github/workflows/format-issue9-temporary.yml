# Temporary formatter on a single branch; remove after gofmt.
name: One-shot issue 9 gofmt
on:
  push:
    branches: [feat/issue-9-agent-policy-reconciler]
permissions:
  contents: read
jobs:
  format:
    if: github.actor == 'maestroi' && github.ref == 'refs/heads/feat/issue-9-agent-policy-reconciler'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format only issue 9 Go files
        run: |
          set -euo pipefail
          gofmt -w internal/agent/*.go internal/safety/policy.go internal/safety/export.go cmd/fleetguard-agent/main.go cmd/fleetguardctl/main.go
          git diff --check
          git add -- internal/agent/*.go internal/safety/policy.go internal/safety/export.go cmd/fleetguard-agent/main.go cmd/fleetguardctl/main.go
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: gofmt issue 9 agent runtime"
          git push origin HEAD:refs/heads/feat/issue-9-agent-policy-reconciler
