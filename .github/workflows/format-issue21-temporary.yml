name: One-shot issue 21 gofmt
on:
  push:
    branches: [feat/issue-21-exposure-profiles-audit]
permissions:
  contents: read
jobs:
  format:
    if: github.actor == 'maestroi' && github.ref == 'refs/heads/feat/issue-21-exposure-profiles-audit'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Format only issue 21 Go files
        run: |
          set -euo pipefail
          gofmt -w internal/exposure/*.go cmd/fleetguardctl/main.go
          git diff --check
          git add -- internal/exposure/*.go cmd/fleetguardctl/main.go
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: gofmt exposure evaluator and operator CLI"
          git push origin HEAD:refs/heads/feat/issue-21-exposure-profiles-audit
